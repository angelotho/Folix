appId: com.folix.app
productName: Folix
copyright: Copyright © 2026 Folix
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.ico
  - package.json
asar: true
# Gera latest.yml (+ .blockmap) para o electron-updater. A publicação é manual:
# anexe Folix-Setup-<v>.exe, Folix-Setup-<v>.exe.blockmap e latest.yml à release.
publish:
  provider: github
  owner: angelotho
  repo: Folix
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
portable:
  artifactName: Folix-${version}.${ext}
nsis:
  artifactName: Folix-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Folix
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Documento Markdown
    description: Documento Markdown (Folix)
    role: Viewer
    icon: build/icon.ico
