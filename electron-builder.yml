appId: com.folix.app
productName: Folix
copyright: Copyright © 2026 Folix
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.ico
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Folix-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Folix
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Documento Markdown
    description: Documento Markdown (Folix)
    role: Viewer
    icon: build/icon.ico
